# Only these new domains; existing applications keep their virtual hosts.
<VirtualHost *:80>
    ServerName habita.roccacr.com
    Alias /.well-known/acme-challenge/ /var/www/habita-crm/acme/.well-known/acme-challenge/
    <Directory /var/www/habita-crm/acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://habita.roccacr.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:80>
    ServerName api-habita.rdghub.com
    Alias /.well-known/acme-challenge/ /var/www/habita-crm/acme/.well-known/acme-challenge/
    <Directory /var/www/habita-crm/acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://api-habita.rdghub.com%{REQUEST_URI} [R=301,L]
</VirtualHost>
