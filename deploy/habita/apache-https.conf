<VirtualHost *:443>
    ServerName habita.roccacr.com
    DocumentRoot /var/www/habita-crm/current/apps/frontend/dist
    RedirectMatch 302 ^/$ /auth/login
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/habita-crm/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/habita-crm/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://habita.roccacr.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'"

    # Browser sessions stay on the CRM origin, preserving existing Strict/Lax cookies.
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /socket.io/ http://127.0.0.1:3100/socket.io/ upgrade=websocket
    ProxyPassReverse /socket.io/ http://127.0.0.1:3100/socket.io/
    ProxyPassMatch ^/(identity|leads|calendar|notes|note-collaboration|note-workflow|notifications|formalization|marketing|catalogs|unit-files|audit|health)(/.*)?$ http://127.0.0.1:3100/$1$2
    ProxyPassReverse / http://127.0.0.1:3100/

    <Directory /var/www/habita-crm/current/apps/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/(identity|leads|calendar|notes|note-collaboration|note-workflow|notifications|formalization|marketing|catalogs|unit-files|audit|health|socket\.io)(/|$)
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [END]
        <Files index.html>
            Header set Cache-Control "no-cache"
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/habita-error.log
    # Do not log OAuth query parameters, cookies or authorization headers.
    CustomLog ${APACHE_LOG_DIR}/habita-access.log "%a %t \"%m %U %H\" %>s %b"
</VirtualHost>

<VirtualHost *:443>
    ServerName api-habita.rdghub.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/habita-crm/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/habita-crm/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    Header always set Strict-Transport-Security "max-age=31536000"
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /socket.io/ http://127.0.0.1:3100/socket.io/ upgrade=websocket
    ProxyPassReverse /socket.io/ http://127.0.0.1:3100/socket.io/
    ProxyPass / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/
    ErrorLog ${APACHE_LOG_DIR}/habita-api-error.log
    CustomLog ${APACHE_LOG_DIR}/habita-api-access.log "%a %t \"%m %U %H\" %>s %b"
</VirtualHost>
