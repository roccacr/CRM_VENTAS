services:
  mysql:
    image: mysql:8.0
    container_name: api-kapso-mysql
    environment:
      MYSQL_ROOT_PASSWORD: integration_root
      MYSQL_DATABASE: api_kapso_bootstrap
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pintegration_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: api-kapso-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
