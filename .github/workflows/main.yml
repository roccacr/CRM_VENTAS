name: Pull on Server

on:
  push:
    branches:
      - produccion

jobs:
  pull_latest_changes:
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest changes on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SCADMINAPIS }}
          port: 22
          script: |
            cd /var/www/produccion
            git pull origin produccion
