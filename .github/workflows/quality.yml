name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - api-kapso

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: api_kapso_bootstrap
          MYSQL_ROOT_PASSWORD: integration_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      PORT: 8002
      API_PREFIX: api/v1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TRUST_PROXY_HOPS: 0
      INTERNAL_RATE_LIMIT_PER_MINUTE: 120
      CRM_JWT_SECRET: integration_crm_jwt_secret_32_chars
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: integration_root
      MYSQL_DATABASE: api_kapso_bootstrap
      MYSQL_MIGRATIONS_RUN: "false"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_TLS: "false"
      REQUIRE_REDIS_INTEGRATION: "true"
      KAPSO_PUBLIC_BASE_URL: http://localhost:8002
      KAPSO_MEDIA_SIGNING_SECRET: integration_media_signing_secret_32_chars
      KAPSO_PLATFORM_WEBHOOK_SECRET: integration_platform_secret
      KAPSO_WHATSAPP_WEBHOOK_SECRET: integration_whatsapp_secret
      KAPSO_PENDING_SYNC_INTERVAL_MS: 0
      KAPSO_LEAD_TEMPLATE_INTERVAL_MS: 0
      ENTRA_TENANT_ID: 00000000-0000-4000-8000-000000000001
      ENTRA_API_AUDIENCE: 00000000-0000-4000-8000-000000000002
      ENTRA_REQUIRED_SCOPE: Kapso.Access
      ENTRA_ALLOWED_CLIENT_IDS: 00000000-0000-4000-8000-000000000003
      KAPSO_API_KEY: integration-kapso-api-key
      KAPSO_API_BASE_URL: https://api.kapso.ai
      KAPSO_META_API_BASE_URL: https://graph.facebook.com
      KAPSO_MEDIA_STORAGE_PATH: archivos-integration
      KAPSO_MEDIA_MAX_FILE_SIZE_MB: 5
      KAPSO_SETUP_REDIRECT_BASE_URL: http://localhost:8002

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit coverage
        run: npm run test:coverage

      - name: HTTP e2e
        run: npm run test:e2e

      - name: MySQL integration
        run: npm run test:integration:coverage

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev
