name: CRM quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref_name != vars.HABITA_RELEASE_BRANCH }}

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      api: ${{ steps.detect.outputs.api }}
      frontend: ${{ steps.detect.outputs.frontend }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      baseline_run: ${{ steps.detect.outputs.baseline_run }}
      baseline_sha: ${{ steps.detect.outputs.baseline_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify change classification
        run: python3 -m unittest discover -s deploy/habita -p 'test_detect_ci_changes.py'
      - name: Verify Habita retention safeguards
        run: python3 -m unittest discover -s deploy/habita -p 'test_cleanup_releases.py'
      - name: Verify automatic frontend batching
        run: python3 -m unittest discover -s deploy/habita -p 'test_frontend_shards.py'
      - id: detect
        run: python3 deploy/habita/detect-ci-changes.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ vars.HABITA_RELEASE_BRANCH }}

  validation:
    name: Validaciones / ${{ matrix.app }} / ${{ matrix.check }}
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
        check: ["format:check", lint, typecheck]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.check }}

  quality:
    name: Quality / api
    needs: [changes, validation, api-checks, api-coverage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Enforce the complete API quality gate
        working-directory: .
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          PLAN_RESULT: ${{ needs.api-checks.result }}
          COVERAGE_RESULT: ${{ needs.api-coverage.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$API_CHANGED" = true ]; then
            test "$VALIDATION_RESULT" = success
            test "$PLAN_RESULT" = success
            test "$COVERAGE_RESULT" = success
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        if: needs.changes.outputs.api == 'true'
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs.api == 'true'
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.api == 'true'
      - name: Reject embedded NetSuite webhook credentials
        if: needs.changes.outputs.api == 'true'
        run: node --input-type=module -e "import { inspectSuiteScripts } from './scripts/package-netsuite.mjs'; inspectSuiteScripts();"

      - run: pnpm build
        if: needs.changes.outputs.api == 'true'
        env:
          VITE_API_ORIGIN: same-origin
          VITE_HABITA_RELEASE: ${{ github.sha }}
      - name: Reuse the unchanged app from successful ancestor CI
        if: needs.changes.outputs.has_changes == 'true' && github.event_name == 'push' && github.ref_protected && github.ref_name == vars.HABITA_RELEASE_BRANCH && needs.changes.outputs.api != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: habita-build-api
          path: apps/api/dist
          run-id: ${{ needs.changes.outputs.baseline_run }}
          github-token: ${{ github.token }}
      - name: Check build files before publishing artifacts
        if: needs.changes.outputs.api == 'true' || (needs.changes.outputs.has_changes == 'true' && github.event_name == 'push' && github.ref_protected && github.ref_name == vars.HABITA_RELEASE_BRANCH)
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find dist \( -type l -o -iname '.env*' -o -iname '*.key' -o -iname '*.pem' -o -iname '*.pfx' -o -iname '*.p12' \) -print -quit)
          if [[ -n "$forbidden" ]]; then
            echo '::error::El build contiene un enlace o un archivo de configuración privado.'
            exit 1
          fi

      - name: Preserve the build verified by CI
        if: needs.changes.outputs.has_changes == 'true' && github.event_name == 'push' && github.ref_protected && github.ref_name == vars.HABITA_RELEASE_BRANCH
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: habita-build-api
          path: apps/api/dist
          if-no-files-found: error
          retention-days: 7

  frontend-checks:
    name: Frontend / Plan y tiempos
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Discover test files without executing them
        run: pnpm exec vitest list --dir test --filesOnly --json=test-results/inventory.json
      - id: history
        name: Locate timing metadata from successful release CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ vars.HABITA_RELEASE_BRANCH }}
        run: python3 ../../deploy/habita/frontend-shards.py --history-run frontend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.history.outputs.run != ''
        continue-on-error: true # El historial es solo una optimización, nunca acredita pruebas.
        with:
          name: ci-timings-frontend
          path: apps/frontend/test-results/history
          run-id: ${{ steps.history.outputs.run }}
          github-token: ${{ github.token }}
      - id: plan
        name: Balance batches by duration (target 90 seconds per runner)
        run: python3 ../../deploy/habita/frontend-shards.py test-results/inventory.json
        env:
          CI_TEST_APP: frontend
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-plan-frontend
          path: apps/frontend/test-results/plan.json
          if-no-files-found: error
          retention-days: 7

  frontend-tests:
    name: Frontend / Pruebas ${{ matrix.shard }}/${{ needs.frontend-checks.outputs.shard_count }}
    needs: [changes, frontend-checks]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.frontend-checks.outputs.matrix) }}
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: test-plan-frontend
          path: apps/frontend/test-results
      - name: Execute this batch with coverage and a mergeable report
        env:
          CI_TEST_PLAN: test-results/plan.json
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.frontend-checks.outputs.shard_count }}
        run: >-
          pnpm exec vitest run --dir test --coverage --maxWorkers=2
          --shard="$SHARD_INDEX/$SHARD_COUNT"
          --reporter=default --reporter=blob
          --outputFile.blob="test-results/blobs/shard-$SHARD_INDEX.json"
      - name: Preserve batch result and coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: frontend-blob-${{ matrix.shard }}
          path: apps/frontend/test-results/blobs/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  frontend-coverage:
    name: Frontend / Cobertura unificada
    needs: [frontend-checks, frontend-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: test-plan-frontend
          path: apps/frontend/test-results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: frontend-blob-*
          path: apps/frontend/test-results/blobs
          merge-multiple: true
      - name: Reject missing, empty or unexpected batch reports
        env:
          SHARD_COUNT: ${{ needs.frontend-checks.outputs.shard_count }}
        run: python3 ../../deploy/habita/frontend-shards.py --verify-reports test-results/blobs "$SHARD_COUNT"
      - name: Merge test results and source coverage without rerunning tests
        run: pnpm exec vitest --merge-reports=test-results/blobs --coverage --reporter=default --reporter=json --outputFile.json=test-results/merged-tests.json
      - name: Upload measured frontend coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-frontend
          path: apps/frontend/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Verify full inventory and export measured timing metadata
        run: python3 ../../deploy/habita/frontend-shards.py --export-timings test-results/merged-tests.json test-results/plan.json test-results/timings.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ci-timings-frontend
          path: apps/frontend/test-results/timings.json
          if-no-files-found: error
          retention-days: 14

  api-checks:
    name: API / Plan y tiempos
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Discover test files without executing them
        run: pnpm exec vitest list --dir test --filesOnly --json=test-results/inventory.json
      - id: history
        name: Locate timing metadata from successful release CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ vars.HABITA_RELEASE_BRANCH }}
        run: python3 ../../deploy/habita/frontend-shards.py --history-run api
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.history.outputs.run != ''
        continue-on-error: true # El historial es solo una optimización, nunca acredita pruebas.
        with:
          name: ci-timings-api
          path: apps/api/test-results/history
          run-id: ${{ steps.history.outputs.run }}
          github-token: ${{ github.token }}
      - id: plan
        name: Balance batches by duration (target 90 seconds per runner)
        run: python3 ../../deploy/habita/frontend-shards.py test-results/inventory.json
        env:
          CI_TEST_APP: api
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-plan-api
          path: apps/api/test-results/plan.json
          if-no-files-found: error
          retention-days: 7

  api-tests:
    name: API / Pruebas ${{ matrix.shard }}/${{ needs.api-checks.outputs.shard_count }}
    needs: [changes, api-checks]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.api-checks.outputs.matrix) }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: test-plan-api
          path: apps/api/test-results
      - name: Execute this batch with coverage and a mergeable report
        env:
          CI_TEST_PLAN: test-results/plan.json
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.api-checks.outputs.shard_count }}
        run: >-
          pnpm exec vitest run --dir test --coverage --maxWorkers=2
          --shard="$SHARD_INDEX/$SHARD_COUNT"
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.lines=0
          --reporter=default --reporter=blob --reporter=./test/support/skipped-persistence-reporter.mjs
          --outputFile.blob="test-results/blobs/shard-$SHARD_INDEX.json"
      - name: Preserve batch result and coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: api-blob-${{ matrix.shard }}
          path: apps/api/test-results/blobs/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  api-coverage:
    name: API / Cobertura unificada
    needs: [api-checks, api-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: test-plan-api
          path: apps/api/test-results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: api-blob-*
          path: apps/api/test-results/blobs
          merge-multiple: true
      - name: Reject missing, empty or unexpected batch reports
        env:
          SHARD_COUNT: ${{ needs.api-checks.outputs.shard_count }}
        run: python3 ../../deploy/habita/frontend-shards.py --verify-reports test-results/blobs "$SHARD_COUNT"
      - name: Merge test results and source coverage without rerunning tests
        run: pnpm exec vitest --merge-reports=test-results/blobs --coverage --reporter=default --reporter=json --reporter=./test/support/skipped-persistence-reporter.mjs --outputFile.json=test-results/merged-tests.json
      - name: Upload measured api coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-api
          path: apps/api/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Verify full inventory and export measured timing metadata
        run: python3 ../../deploy/habita/frontend-shards.py --export-timings test-results/merged-tests.json test-results/plan.json test-results/timings.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ci-timings-api
          path: apps/api/test-results/timings.json
          if-no-files-found: error
          retention-days: 14

  frontend-quality:
    name: Quality / frontend
    needs: [changes, validation, frontend-checks, frontend-coverage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      # El check requerido debe fallar, no quedar omitido, si falla un lote o la planificación.
      - name: Enforce the complete frontend quality gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          CHECKS_RESULT: ${{ needs.frontend-checks.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          COVERAGE_RESULT: ${{ needs.frontend-coverage.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$FRONTEND_CHANGED" = true ]; then
            test "$CHECKS_RESULT" = success
            test "$VALIDATION_RESULT" = success
            test "$COVERAGE_RESULT" = success
          fi
        working-directory: .
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        if: needs.changes.outputs.frontend == 'true'
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.frontend == 'true'
      - run: pnpm build
        if: needs.changes.outputs.frontend == 'true'
        env:
          VITE_API_ORIGIN: same-origin
          VITE_HABITA_RELEASE: ${{ github.sha }}
      - name: Reuse the unchanged app from successful ancestor CI
        if: needs.changes.outputs.has_changes == 'true' && github.event_name == 'push' && github.ref_protected && github.ref_name == vars.HABITA_RELEASE_BRANCH && needs.changes.outputs.frontend != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: habita-build-frontend
          path: apps/frontend/dist
          run-id: ${{ needs.changes.outputs.baseline_run }}
          github-token: ${{ github.token }}
      - name: Check build files before publishing artifacts
        if: needs.changes.outputs.frontend == 'true' || (needs.changes.outputs.has_changes == 'true' && github.event_name == 'push' && github.ref_protected && github.ref_name == vars.HABITA_RELEASE_BRANCH)
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find dist \( -type l -o -iname '.env*' -o -iname '*.key' -o -iname '*.pem' -o -iname '*.pfx' -o -iname '*.p12' \) -print -quit)
          if [[ -n "$forbidden" ]]; then
            echo '::error::El build contiene un enlace o un archivo de configuración privado.'
            exit 1
          fi

      - name: Preserve the build verified by CI
        if: needs.changes.outputs.has_changes == 'true' && github.event_name == 'push' && github.ref_protected && github.ref_name == vars.HABITA_RELEASE_BRANCH
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: habita-build-frontend
          path: apps/frontend/dist
          if-no-files-found: error
          retention-days: 7

  package-habita:
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref_protected &&
      github.ref_name == vars.HABITA_RELEASE_BRANCH &&
      needs.changes.outputs.has_changes == 'true' &&
      needs.quality.result == 'success' && needs.frontend-quality.result == 'success' && needs.dependency-audit.result == 'success' &&
      (needs.habita-netsuite.result == 'success' || needs.habita-netsuite.result == 'skipped') }}
    needs: [changes, quality, frontend-quality, dependency-audit, habita-netsuite]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: habita-build-api
          path: apps/api/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: habita-build-frontend
          path: apps/frontend/dist
      - name: Package and record commit and SHA-256
        run: python3 deploy/habita/package-ci-release.py release-package
        env:
          HABITA_CHANGED_APPS: ${{ needs.changes.outputs.apps }}
          HABITA_BASELINE_RUN: ${{ needs.changes.outputs.baseline_run }}
          HABITA_BASELINE_SHA: ${{ needs.changes.outputs.baseline_sha }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: habita-release
          path: release-package/
          if-no-files-found: error
          retention-days: 14

  deploy-qa:
    if: vars.HABITA_QA_ENABLED == 'true'
    needs: package-habita
    uses: ./.github/workflows/habita-promote.yml
    with:
      target: habita-qa

  deploy-production:
    if: >-
      ${{ !cancelled() &&
      vars.HABITA_PRODUCTION_ENABLED == 'true' &&
      needs.package-habita.result == 'success' &&
      (needs.deploy-qa.result == 'success' ||
       (vars.HABITA_QA_ENABLED != 'true' && needs.deploy-qa.result == 'skipped')) }}
    needs: [package-habita, deploy-qa]
    uses: ./.github/workflows/habita-promote.yml
    with:
      target: production
    secrets:
      KAPSO_SSH_KEY: ${{ secrets.SCADMINAPIS }}

  dependency-audit:
    name: Dependencies / ${{ matrix.app }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [api, frontend]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        if: needs.changes.outputs[matrix.app] == 'true'
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs[matrix.app] == 'true'
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs[matrix.app] == 'true'
      - name: Audit production and development dependencies without modifying lockfiles (blocks on high/critical)
        if: needs.changes.outputs[matrix.app] == 'true'
        run: pnpm audit --audit-level=high

  habita-netsuite:
    name: Habita / NetSuite properties and fuzzing
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run generated cases on disposable InnoDB
        env:
          NETSUITE_EVENTS_LOCAL_SQL_TESTS: "1"
        run: |
          set -euo pipefail
          container=$(docker run --detach --rm \
            --publish 127.0.0.1:3309:3306 \
            --env MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 \
            --tmpfs /tmp/netsuite-events-mariadb-20261102:rw,size=512m \
            mariadb:10.11@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae \
            --datadir=/tmp/netsuite-events-mariadb-20261102)
          trap 'docker stop "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$container" healthcheck.sh --connect --innodb_initialized; then
              pnpm test --maxWorkers=1 --reporter=default --reporter=json \
                --outputFile.json=coverage/habita-netsuite-sql.json \
                test/integrations/netsuite-order-events.local-sql.spec.ts
              node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const report = JSON.parse(readFileSync("coverage/habita-netsuite-sql.json", "utf8"));
          const passed = report.testResults.flatMap(({ assertionResults }) => assertionResults)
              .filter(({ status }) => status === "passed");
          for (const prefix of ["keeps the newest revision", "rejects generated"]) {
              assert.ok(passed.filter(({ title }) => title.startsWith(prefix)).length >= 2,
                  "Both Habita SQL cases must run and pass for: " + prefix);
          }
          NODE
              pnpm test --maxWorkers=1 \
                test/integrations/netsuite-order-event-window.spec.ts \
                test/integrations/netsuite-production-events.http.spec.ts \
                test/integrations/netsuite-production-events.spec.ts \
                test/security/finiquito.http.spec.ts \
                test/sales-orders/formalization-approval.spec.ts
              exit 0
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1

  mysql-availability:
    name: MySQL / infrastructure (informational)
    needs: changes
    # Infraestructura opcional: omitida si no se preparó, nunca presentada como SQL verificado.
    if: needs.changes.outputs.api == 'true' && vars.CRM_MYSQL_TESTS_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require explicitly prepared test infrastructure
        env:
          READY: ${{ vars.CRM_MYSQL_TESTS_READY }}
          TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$READY" != "true" ] || [ "$TRUSTED" != "true" ]; then
            echo "::error::BLOQUEADO POR INFRAESTRUCTURA: MySQL aislado no habilitado o PR externo sin acceso autorizado."
            echo "MySQL no verificado; quality continua de forma independiente." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  mysql:
    name: MySQL / persistence (informational)
    continue-on-error: true
    needs: [changes, mysql-availability]
    if: needs.changes.outputs.api == 'true' && vars.CRM_MYSQL_TESTS_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crm-mysql-tests
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify destination and execute authorized native suites
        run: pnpm test:mysql:ci
        env:
          CRM_MYSQL_TESTS_READY: "true"
          MYSQL_TEST_CONFIRM: ISOLATED_TEST_DATABASE
          MYSQL_TEST_SERVER_UUID: ${{ secrets.MYSQL_TEST_SERVER_UUID }}
          MYSQL_TEST_DATASET: ${{ vars.MYSQL_TEST_DATASET }}
          DB_HOST: ${{ secrets.MYSQL_TEST_DB_HOST }}
          DB_PORT: ${{ vars.MYSQL_TEST_DB_PORT }}
          DB_USER: ${{ secrets.MYSQL_TEST_DB_USER }}
          DB_PASSWORD: ${{ secrets.MYSQL_TEST_DB_PASSWORD }}
          DB_NAME: CRM_THINK_V2
          DB_SSL: "true"
          ENABLE_LEGACY_FALLBACK: "false"
          LEGACY_CRM_DB_NAME: ""
      - name: Upload sanitized persistence summary
        if: always() && hashFiles('apps/api/coverage/mysql-ci-summary.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mysql-ci-summary
          path: apps/api/coverage/mysql-ci-summary.json
          if-no-files-found: error
          retention-days: 7
